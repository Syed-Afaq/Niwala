services:
  postgres:
    image: postgres:16-alpine
    container_name: niwala_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: niwala
      POSTGRES_PASSWORD: niwala
      POSTGRES_DB: niwala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niwala -d niwala"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
